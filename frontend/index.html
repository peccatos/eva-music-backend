<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player UI</title>
    <link rel="stylesheet" href="./css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="app">
      <section class="hero" aria-label="Обложка альбома">
        <div class="hero__label">
          <h1 id="trackTitle"></h1>
          <p id="trackArtist"></p>
        </div>

        <div class="hero__art" role="img" aria-label="Обложка альбома Meteora">
          <button id="playBtn" class="hero__play" type="button" aria-label="Воспроизвести">
            <span>▶</span>
          </button>

          <div class="hero__nav" aria-label="Переключение треков">
            <button id="prevBtn" type="button" aria-label="Предыдущий трек">‹‹</button>
            <button id="nextBtn" type="button" aria-label="Следующий трек">››</button>
          </div>
        </div>
      </section>

      <section class="progress" aria-label="Прогресс воспроизведения">
        <span id="currentTime">0:00</span>
        <input id="progress" type="range" min="0" max="1" step="0.001" value="0" />
        <span id="duration">0:00</span>
      </section>

      <section class="notice" aria-label="Ограничение памяти">
        <p>Проект держится на минимальном бюджете. Не спамьте запросами и загрузками.</p>
      </section>

      <section class="userbar" aria-label="Ручной идентификатор пользователя">
        <input
          id="userIdInput"
          type="number"
          inputmode="numeric"
          placeholder="Telegram user id"
        />
        <button id="saveUserIdBtn" type="button">Use ID</button>
      </section>

      <section class="debug" aria-label="Telegram debug">
        <pre id="telegramDebug"></pre>
      </section>

      <section class="sheet" aria-label="Информация о треке">
        <div class="sheet__group">
          <button type="button" class="sheet__line sheet__line--single" id="line1"></button>
          <button type="button" class="sheet__line sheet__line--multi" id="line2">
            <span id="line2Part1"></span><br />
            <span id="line2Part2"></span>
          </button>
          <button type="button" class="sheet__line sheet__line--single sheet__line--ghost" id="line3"></button>
        </div>

        <button type="button" class="button button--icon" id="primaryAction" aria-label="Перемешивание">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 3h5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 4l16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M16 21h5v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 14l2 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M14 10l5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button type="button" class="button button--icon" id="secondaryAction" aria-label="Повтор">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 23l-4-4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 5H7a4 4 0 0 0-4 4v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M3 19h14a4 4 0 0 0 4-4v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button type="button" class="button button--icon button--add" id="saveBtn" aria-label="Добавить трек">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </button>

        <section class="library" aria-label="Библиотека треков">
          <h2 class="library__title">Треки в lib</h2>
          <div class="library__list" id="trackList"></div>
        </section>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
